[workspace]
members = [
    "dad-core",
    "dadctl",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["DAD Project Contributors"]
license = "MIT"
repository = "https://github.com/yourusername/dad"

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.4", features = ["derive"] }
rusqlite = { version = "0.30", features = ["bundled"] }
sha1 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
zmq = "0.10"
async-trait = "0.1"
